<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AiBrewGenius · RAPT Dashboard</title>
  <link rel="stylesheet" href="css/styles.css?v=4" />
  <style>
    html,body {min-height:100%;overflow:auto;}
    body {background:#020617;color:#f1f5f9;}
    .rapt-stack {display:flex;flex-direction:column;gap:20px;}
    .rapt-panel {width:100%;background: rgba(15,23,42,0.92);padding: 28px;border-radius: 24px;box-shadow: 0 30px 70px rgba(0,0,0,0.5);backdrop-filter: blur(12px);}
    .rapt-meta {font-size:13px;color:#cbd5f5;margin-bottom:16px;}
    .rapt-meta span {display:inline-flex;align-items:center;margin-right:18px;gap:6px;}
    .rapt-actions {display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
    .rapt-links {display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
    .rapt-status {margin-bottom:8px;color:#fbbf24;}
    .rapt-range {margin-bottom:16px;font-size:14px;color:#cbd5f5;}
    .btn.ghost {background:transparent;border:1px solid rgba(148,163,184,0.4);}
    .btn.ghost:hover {background:rgba(148,163,184,0.08);}
    .btn.icon {padding:0;width:42px;height:42px;display:flex;align-items:center;justify-content:center;font-size:18px;}
    .chart-card {background:#0b1120;padding:18px;border-radius:20px;border:1px solid rgba(148,163,184,0.2);}
    .chart-card h3 {margin:0 0 8px;font-size:28px;font-weight:700;}
    .chart-card p {margin:0 0 16px;color:#94a3b8;font-size:14px;}
    .chart-frame {height:clamp(320px,45vh,520px);width:100%;overflow:hidden;}
    .chart-frame canvas {display:block;width:100%;height:100%;max-width:100%;}
    .telemetry-summary {display:flex;flex-wrap:wrap;gap:16px;margin-top:18px;}
    .summary-tile {flex:1;min-width:200px;background:rgba(15,23,42,0.65);border:1px solid rgba(148,163,184,0.25);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px;}
    .summary-label {font-size:15px;color:#cbd5f5;text-transform:uppercase;letter-spacing:0.08em;}
    .summary-value {font-size:clamp(36px,6vw,64px);font-weight:700;line-height:1;color:#f8fafc;}
    .summary-unit {font-size:16px;color:rgba(241,245,249,0.7);}
    .summary-tile.blue {border-color:rgba(59,130,246,0.4);}
    .summary-tile.red {border-color:rgba(239,68,68,0.4);}
    @media (max-width:640px){
      .summary-value {font-size:42px;}
    }
  </style>
</head>
<body data-page="rapt">
  <main class="gpt-shell">
    <header class="gpt-head">
      <h1 id="page-title">Gesammelte Telemetrie</h1>
    </header>

    <section class="gpt-preview rapt-stack">
      <div class="rapt-panel">
        <div class="rapt-links">
          <a class="btn ghost" href="rapt-token.html">Bearer-Details</a>
          <a class="btn ghost" href="rapt-table.html">Tabellenansicht</a>
        </div>
        <div class="rapt-actions">
          <button class="btn primary" id="btn-telemetry">Telemetry laden</button>
          <button class="btn ghost icon" id="btn-reload" title="Neu laden">⟳</button>
          <button class="btn ghost" id="btn-download" disabled>CSV herunterladen</button>
        </div>
        <div class="rapt-status" id="telemetry-status">Noch nicht geladen.</div>
        <div class="rapt-range" id="telemetry-range">Zeitraum unbekannt.</div>
        <div class="chart-card">
          <h3 id="profile-title"></h3>
          <div class="chart-frame">
            <canvas id="telemetry-chart"></canvas>
          </div>
          <div class="telemetry-summary">
            <div class="summary-tile blue">
              <span class="summary-label">Temperatur</span>
              <span class="summary-value" id="summary-temp">–</span>
              <span class="summary-unit">°C</span>
            </div>
            <div class="summary-tile red">
              <span class="summary-label">Gravity</span>
              <span class="summary-value" id="summary-gravity">–</span>
              <span class="summary-unit">SG</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <footer class="gpt-foot">
      <a class="btn" href="index.html">Zur Startseite</a>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const dayMarkerPlugin={
      id:'dayMarkers',
      afterDatasetsDraw(chart){
        const opts=chart.options?.plugins?.dayMarkers;
        const labels=opts?.labels;
        if(!labels?.length) return;
        const xScale=chart.scales?.x;
        const ctx=chart.ctx;
        if(!xScale||!ctx) return;
        let lastDay=null;
        ctx.save();
        ctx.strokeStyle=opts?.color || 'rgba(148,163,184,0.35)';
        ctx.lineWidth=opts?.width || 1;
        labels.forEach((label,idx)=>{
          const day=(label||'').split('T')[0];
          if(!day || day===lastDay) return;
          lastDay=day;
          const x=xScale.getPixelForValue(idx);
          if(Number.isNaN(x)) return;
          ctx.beginPath();
          ctx.moveTo(x,chart.chartArea.top);
          ctx.lineTo(x,chart.chartArea.bottom);
          ctx.stroke();
        });
        ctx.restore();
      }
    };
    Chart.register(dayMarkerPlugin);

    const telemetryBtn=document.getElementById('btn-telemetry');
    const reloadBtn=document.getElementById('btn-reload');
    const telemetryStatus=document.getElementById('telemetry-status');
    const telemetryRange=document.getElementById('telemetry-range');
    const downloadBtn=document.getElementById('btn-download');
    const chartCanvas=document.getElementById('telemetry-chart');
    const profileTitle=document.getElementById('profile-title');
    const pageTitle=document.getElementById('page-title');
    const summaryTemp=document.getElementById('summary-temp');
    const summaryGravity=document.getElementById('summary-gravity');
    let telemetryChart=null;
    let latestTelemetry=[];

    telemetryBtn.addEventListener('click',()=>loadTelemetry(false));
    reloadBtn.addEventListener('click',()=>loadTelemetry(true));
    downloadBtn.addEventListener('click',downloadCsv);
    downloadBtn.disabled=true;
    updateProfileHeading();
    updateSummary([]);

    loadTelemetry();

    async function loadTelemetry(force=false){
      telemetryStatus.textContent=force?'♻️ Aktualisiere Daten ...':'⏳ Telemetrie wird geladen ...';
      telemetryRange.textContent='Zeitraum wird geladen ...';
      setLoadingState(true);
      try{
        const endpoint=force?'/api/rapt/telemetry?reload=1':'/api/rapt/telemetry';
        const response=await fetch(endpoint);
        const data=await response.json().catch(()=>({}));
        if(!response.ok){
          telemetryStatus.textContent=`❗ HTTP ${response.status}`;
          renderChart([]);
          updateRangeInfo();
          updateProfileHeading();
          updateSummary([]);
          setLoadingState(false);
          return;
        }
        const allRows=Array.isArray(data.rows)?data.rows:[];
        const errorRows=allRows.filter(r=>r?.error);
        if(errorRows.length){
          console.warn('Gefilterte RAPT-Einträge wegen Fehlern:',errorRows);
        }
        const rows=allRows.filter(r=>!r?.error);
        if(!rows.length){
          telemetryStatus.textContent=errorRows.length
            ? `⚠️ Keine gültigen Telemetriedaten ( ${errorRows.length} ohne Startdatum ).`
            : 'Keine Telemetriedaten vorhanden.';
          renderChart([]);
          updateRangeInfo();
          updateProfileHeading();
          updateSummary([]);
          return;
        }
        let statusMsg=`✅ ${rows.length} Messpunkte · Stand ${data.generatedAt || ''}`;
        if(errorRows.length){
          statusMsg+=` · ${errorRows.length} ohne Startdatum ignoriert`;
        }
        telemetryStatus.textContent=statusMsg;
        const start=data.startDate || rows[0]?.startDate || '';
        const end=data.endDate || data.generatedAt || rows[rows.length-1]?.startDate || '';
        updateRangeInfo(start,end);
        const resolvedProfileName=data.profileName || rows.find(r=>r?.profileName)?.profileName || null;
        updateProfileHeading(resolvedProfileName);
        renderChart(rows);
        updateSummary(rows);
        setLoadingState(false);
      }catch(error){
        telemetryStatus.textContent='❗ Telemetrie-Abruf fehlgeschlagen';
        renderChart([]);
        updateRangeInfo();
        updateProfileHeading();
        updateSummary([]);
        setLoadingState(false);
      }
    }

    function renderChart(rows){
      latestTelemetry=rows;
      downloadBtn.disabled=!rows.length;
      const labels=rows.map(r=>r.startDate || '');
      const gravityValues=rows
        .map(r=>normalizeGravity(r?.gravity))
        .filter(v=>v!==null && Number.isFinite(v));
      const gravityMax=gravityValues.length?Math.max(...gravityValues):1.05;
      const gravityMin=1.0;
      const datasets=[
        {
          label:'Temperatur (°C)',
          data:rows.map(r=>r?.temperature ?? null),
          borderColor:'#3b82f6',
          backgroundColor:'rgba(59,130,246,0.05)',
          yAxisID:'yTemp',
          fill:false,
          tension:0.25,
          spanGaps:true,
          borderWidth:1,
          pointRadius:0,
          pointHitRadius:8,
          pointHoverRadius:4
        },
        {
          label:'Gravity',
          data:rows.map(r=>normalizeGravity(r?.gravity)),
          borderColor:'#ef4444',
          backgroundColor:'rgba(239,68,68,0.05)',
          yAxisID:'yGravity',
          fill:false,
          tension:0.25,
          spanGaps:true,
          borderWidth:1,
          pointRadius:0,
          pointHitRadius:8,
          pointHoverRadius:4
        }
      ];

      const config={
        type:'line',
        data:{labels,datasets},
        options:{
          responsive:true,
          maintainAspectRatio:false,
          interaction:{mode:'index',intersect:false},
          plugins:{
            legend:{position:'bottom',labels:{color:'#f1f5f9',usePointStyle:true,pointStyle:'line',boxWidth:36}},
            tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: ${ctx.formattedValue}`}},
            dayMarkers:{labels,color:'rgba(148,163,184,0.4)',width:0.8}
          },
          scales:{
            yTemp:{
              type:'linear',
              position:'left',
              suggestedMin:0,
              suggestedMax:30,
              grid:{color:'rgba(59,130,246,0.12)'},
              ticks:{color:'#3b82f6'},
              title:{display:true,text:'°C',color:'#3b82f6'}
            },
            yGravity:{
              type:'linear',
              position:'right',
              min:gravityMin,
              max:Math.max(gravityMin,gravityMax),
              grid:{drawOnChartArea:false},
              ticks:{color:'#ef4444'},
              title:{display:true,text:'Gravity',color:'#ef4444'}
            },
            x:{
              ticks:{color:'#cbd5f5',callback:(value,index)=>formatTimestamp(labels[index]||'')},
              grid:{color:'rgba(148,163,184,0.08)'}
            }
          }
        }
      };

      if(telemetryChart){
        telemetryChart.data=config.data;
        telemetryChart.options=config.options;
        telemetryChart.update();
      }else if(chartCanvas){
        telemetryChart=new Chart(chartCanvas.getContext('2d'),config);
      }
    }

    function formatTimestamp(label){
      if(!label) return '';
      return label.replace(/^\\d{4}-/,'').replace('T',' ').substring(0,16);
    }

    function normalizeGravity(value){
      if(value===undefined || value===null) return null;
      const num=Number(value);
      if(!Number.isFinite(num)) return null;
      return num/1000;
    }

    function updateSummary(rows){
      const latest=Array.isArray(rows) && rows.length?rows[rows.length-1]:null;
      if(summaryTemp){
        summaryTemp.textContent=formatTempDisplay(latest?.temperature);
      }
      if(summaryGravity){
        const gravityValue=latest?normalizeGravity(latest?.gravity):null;
        summaryGravity.textContent=formatGravityDisplay(gravityValue);
      }
    }

    function formatTempDisplay(value){
      if(value===undefined || value===null) return '–';
      const num=Number(value);
      if(!Number.isFinite(num)) return '–';
      return num.toLocaleString('de-CH',{minimumFractionDigits:1,maximumFractionDigits:1});
    }

    function formatGravityDisplay(value){
      if(value===undefined || value===null) return '–';
      const num=Number(value);
      if(!Number.isFinite(num)) return '–';
      return num.toFixed(3);
    }

    function updateProfileHeading(name){
      if(profileTitle){
        profileTitle.textContent=name || '';
      }
      if(pageTitle){
        pageTitle.textContent=name || 'Gesammelte Telemetrie';
      }
    }

    function updateRangeInfo(start,end){
      if(!telemetryRange) return;
      if(!start && !end){
        telemetryRange.textContent='Zeitraum unbekannt.';
        return;
      }
      const startLabel=formatRangeDate(start);
      const endLabel=formatRangeDate(end);
      telemetryRange.textContent=`Zeitraum: ${startLabel || '–'} → ${endLabel || '–'}`;
    }

    function formatRangeDate(value){
      if(!value) return '';
      const date=new Date(value);
      if(Number.isNaN(date.getTime())) return value;
      return date.toLocaleString('de-CH',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    }

    function downloadCsv(){
      if(!latestTelemetry.length) return;
      const columns=['startDate','temperature','gravity','gravityVelocity'];
      const header=columns.join(';');
      const lines=latestTelemetry.map(row=>columns.map(col=>escapeCsv(row?.[col])).join(';'));
      const csv=[header,...lines].join('\\r\\n');
      const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
      const url=URL.createObjectURL(blob);
      const link=document.createElement('a');
      link.href=url;
      link.download=`rapt-telemetrie-${new Date().toISOString().slice(0,19)}.csv`;
      link.click();
      setTimeout(()=>URL.revokeObjectURL(url),2000);
    }

    function setLoadingState(isLoading){
      if(telemetryBtn) telemetryBtn.disabled=isLoading;
      if(reloadBtn) reloadBtn.disabled=isLoading;
      if(downloadBtn) downloadBtn.disabled=isLoading || !latestTelemetry.length;
    }

    function escapeCsv(value){
      if(value===undefined || value===null) return '';
      const str=String(value);
      if(/[\";\\n]/.test(str)){
        return `"${str.replace(/\"/g,'""')}"`;
      }
      return str;
    }
  </script>
</body>
</html>

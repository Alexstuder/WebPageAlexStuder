<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AiBrewGenius · RAPT Bearer</title>
  <link rel="stylesheet" href="css/styles.css?v=4" />
  <style>
    body {background:#020617;color:#f1f5f9;}
    .rapt-stack {display:flex;flex-direction:column;gap:20px;}
    .rapt-panel {width:100%;background: rgba(15,23,42,0.92);padding: 28px;border-radius: 24px;box-shadow: 0 30px 70px rgba(0,0,0,0.5);backdrop-filter: blur(12px);}
    .rapt-actions {display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
    .rapt-status {margin-bottom:12px;color:#fbbf24;}
    .rapt-result {background:#0b1120;border:1px solid rgba(148,163,184,0.35);border-radius:16px;padding:18px;font-size:14px;}
    details {border:1px solid rgba(148,163,184,0.35);border-radius:12px;padding:16px;background:#0b1120;margin-bottom:12px;}
    summary {cursor:pointer;font-weight:600;color:#bae6fd;}
    code {color:#facc15;}
  </style>
</head>
<body data-page="rapt">
  <main class="gpt-shell">
    <header class="gpt-head">
      <div class="gpt-badge">Automatisch</div>
      <h1>Bearer Token Verwaltung</h1>
      <p>Hier kannst du dir den aktuell serverseitig generierten Bearer Token ansehen oder bei Bedarf aktualisieren.</p>
    </header>

    <section class="gpt-preview rapt-stack">
      <div class="rapt-panel">
        <div class="rapt-actions">
          <button class="btn primary" id="btn-token">Token aktualisieren</button>
          <a class="btn" href="rapt.html">Zurück zum Dashboard</a>
        </div>
        <div class="rapt-status" id="token-status">Noch kein Token geladen.</div>
        <div id="token-data" class="rapt-result">-</div>
      </div>
    </section>

    <footer class="gpt-foot">
      <a class="btn" href="index.html">Zur Startseite</a>
    </footer>
  </main>

  <script>
    const tokenBtn=document.getElementById('btn-token');
    const tokenStatus=document.getElementById('token-status');
    const tokenData=document.getElementById('token-data');

    tokenBtn.addEventListener('click',loadToken);
    loadToken();

    async function loadToken(){
      tokenStatus.textContent='⏳ Token wird abgerufen ...';
      tokenData.textContent='';
      try{
        const response=await fetch('/api/rapt/token',{method:'POST'});
        const data=await response.json().catch(()=>({}));
        if(!response.ok){
          tokenStatus.textContent=`❗ HTTP ${response.status}`;
          tokenData.textContent=JSON.stringify(data,null,2);
          return;
        }
        tokenStatus.textContent='✅ Token erfolgreich geladen';
        tokenData.innerHTML=renderNodes(data,'token');
      }catch(error){
        tokenStatus.textContent='❗ Token-Abruf fehlgeschlagen';
        tokenData.textContent=error.message;
      }
    }

    function renderNodes(node,label='root'){
      if(Array.isArray(node)){
        if(!node.length) return `<p><strong>${escapeHtml(label)}</strong>: []</p>`;
        return node.map((item,idx)=>renderNodes(item,`${label}[${idx}]`)).join('');
      }
      if(node && typeof node==='object'){
        const entries=Object.entries(node).map(([key,val])=>renderNodes(val,key)).join('');
        return `<details open><summary>${escapeHtml(label)}</summary>${entries}</details>`;
      }
      return `<p><strong>${escapeHtml(label)}</strong>: <code>${escapeHtml(String(node))}</code></p>`;
    }

    function escapeHtml(str){
      return str
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#39;');
    }
  </script>
</body>
</html>

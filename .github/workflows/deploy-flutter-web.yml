name: Build & Deploy Flutter Web

on:
  push:
    branches:
      - main        # bei Bedarf ändern
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'

      - name: Create .env from secret
        run: |
          cat <<'EOF' > flutter_brew_assistent/.env
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          EOF

      - name: Install dependencies
        run: flutter pub get
        working-directory: flutter_brew_assistent

      - name: Build Flutter web
        run: flutter build web --wasm
        working-directory: flutter_brew_assistent

      - name: Deploy to VPS via rsync
        uses: burnett01/rsync-deployments@v3.1
        with:
          switches: -avz --delete
          path: flutter_brew_assistent/build/web/
          remote_path: ${{ secrets.DEPLOY_PATH }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_port: ${{ secrets.SSH_PORT || 22 }}
          ssh_key: ${{ secrets.SSH_KEY }}

      - name: Write .env on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cat <<'EOF' > ${{ secrets.DEPLOY_PATH }}/.env
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            EOF

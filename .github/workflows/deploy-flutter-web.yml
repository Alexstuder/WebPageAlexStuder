name: Build & Deploy Flutter Web

on:
  push:
    branches:
      - main        # bei Bedarf ändern
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      SSH_PORT: ${{ secrets.SSH_PORT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'

      - name: Create Flutter .env
        run: |
          cat <<'EOF' > flutter_brew_assistent/.env
          PROXY_URL=${{ secrets.PROXY_URL }}
          EOF

      - name: Install dependencies
        run: flutter pub get
        working-directory: flutter_brew_assistent

      - name: Build Flutter web
        run: flutter build web --wasm
        working-directory: flutter_brew_assistent

      - name: Prepare SSH key
        run: |
          PORT=${SSH_PORT:-22}
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy_key
          chmod 600 ~/.ssh/id_deploy_key
          ssh-keyscan -p $PORT ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Flutter web to VPS
        run: |
          PORT=${SSH_PORT:-22}
          rsync -avz --delete -e "ssh -i ~/.ssh/id_deploy_key -p $PORT" flutter_brew_assistent/build/web/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Deploy proxy to VPS
        run: |
          PORT=${SSH_PORT:-22}
          rsync -avz --delete -e "ssh -i ~/.ssh/id_deploy_key -p $PORT" proxy/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/proxy/

      - name: Write proxy .env on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            mkdir -p ${{ secrets.DEPLOY_PATH }}/proxy
            cat <<'EOF' > ${{ secrets.DEPLOY_PATH }}/proxy/.env
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
            EOF

name: Build & Deploy Flutter Web

on:
  push:
    branches:
      - main        # bei Bedarf ändern
  workflow_dispatch:
    inputs:
      update_db:
        description: 'Update Database (Init & Seed) - DANGER: CRYSTAL CLEAR DATA LOSS!'
        required: false
        type: boolean
        default: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      SSH_PORT: ${{ secrets.SSH_PORT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'

      - name: Create Flutter .env
        run: |
          cat <<'EOF' > flutter_brew_assistent/.env
          PROXY_URL=${{ secrets.PROXY_URL }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF

      - name: Install dependencies
        run: flutter pub get
        working-directory: flutter_brew_assistent

      - name: Build Flutter web
        run: flutter build web --wasm --base-href /brew_app/ --dart-define=PROXY_URL=${{ secrets.PROXY_URL }}
        working-directory: flutter_brew_assistent

      - name: Prepare SSH key
        run: |
          PORT=${SSH_PORT:-22}
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy_key
          chmod 600 ~/.ssh/id_deploy_key
          ssh-keyscan -p $PORT ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Flutter web to VPS
        run: |
          PORT=${SSH_PORT:-22}
          rsync -avz --delete \
            --exclude 'proxy/' \
            -e "ssh -i ~/.ssh/id_deploy_key -p $PORT" \
            flutter_brew_assistent/build/web/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Deploy static site root to VPS
        run: |
          PORT=${SSH_PORT:-22}
          rsync -avz \
            --exclude '.git/' \
            --exclude 'flutter_brew_assistent/' \
            --exclude 'proxy/' \
            --exclude '.github/' \
            --exclude '.gitignore' \
            --exclude 'README.md' \
            -e "ssh -i ~/.ssh/id_deploy_key -p $PORT" ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/../

      - name: Deploy DB scripts to VPS
        run: |
          PORT=${SSH_PORT:-22}
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_deploy_key -p $PORT" \
            db_scripts/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/db_scripts/

      - name: Run DB Init and Seed (Manual Only)
        if: github.event.inputs.update_db == 'true'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            # Use Supabase CLI style on VPS if possible, or direct docker if container exists
            # For now, keeping the pattern but ensuring it's manual and can be adjusted
            DB_PASS=$(docker exec supabase_db_supabase printenv POSTGRES_PASSWORD)
            
            # Running Init Schema
            docker exec -e PGPASSWORD=$DB_PASS -i supabase_db_supabase psql -U supabase_admin -d postgres < ${{ secrets.DEPLOY_PATH }}/db_scripts/full/001_init_schema.sql

            # Running Seed
            docker exec -e PGPASSWORD=$DB_PASS -i supabase_db_supabase psql -U supabase_admin -d postgres < ${{ secrets.DEPLOY_PATH }}/db_scripts/full/aibrewgenius_seed.sql


      - name: Deploy proxy to VPS
        run: |
          PORT=${SSH_PORT:-22}
          rsync -avz --delete \
            --exclude 'node_modules/' \
            -e "ssh -i ~/.ssh/id_deploy_key -p $PORT" \
            proxy/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/proxy/

      - name: Write proxy .env on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            mkdir -p ${{ secrets.DEPLOY_PATH }}/proxy
            cat <<'EOF' > ${{ secrets.DEPLOY_PATH }}/proxy/.env
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
            RAPT_API_KEY=${{ secrets.RAPT_API_KEY }}
            RAPT_USERNAME=${{ secrets.RAPT_USERNAME }}
            EOF
            [ -n "${{ secrets.RAPT_TOKEN_ENDPOINT }}" ] && echo "RAPT_TOKEN_ENDPOINT=${{ secrets.RAPT_TOKEN_ENDPOINT }}" >> ${{ secrets.DEPLOY_PATH }}/proxy/.env
            [ -n "${{ secrets.RAPT_API_BASE }}" ] && echo "RAPT_API_BASE=${{ secrets.RAPT_API_BASE }}" >> ${{ secrets.DEPLOY_PATH }}/proxy/.env
            [ -n "${{ secrets.RAPT_PROFILE_ENDPOINT }}" ] && echo "RAPT_PROFILE_ENDPOINT=${{ secrets.RAPT_PROFILE_ENDPOINT }}" >> ${{ secrets.DEPLOY_PATH }}/proxy/.env
            [ -n "${{ secrets.RAPT_CONTROLLER_ENDPOINT }}" ] && echo "RAPT_CONTROLLER_ENDPOINT=${{ secrets.RAPT_CONTROLLER_ENDPOINT }}" >> ${{ secrets.DEPLOY_PATH }}/proxy/.env
            [ -n "${{ secrets.RAPT_TELEMETRY_ENDPOINT }}" ] && echo "RAPT_TELEMETRY_ENDPOINT=${{ secrets.RAPT_TELEMETRY_ENDPOINT }}" >> ${{ secrets.DEPLOY_PATH }}/proxy/.env
            [ -n "${{ secrets.RAPT_CONTROLLER_USE }}" ] && echo "RAPT_CONTROLLER_USE=${{ secrets.RAPT_CONTROLLER_USE }}" >> ${{ secrets.DEPLOY_PATH }}/proxy/.env
            [ -n "${{ secrets.RAPT_CACHE_INTERVAL_MS }}" ] && echo "RAPT_CACHE_INTERVAL_MS=${{ secrets.RAPT_CACHE_INTERVAL_MS }}" >> ${{ secrets.DEPLOY_PATH }}/proxy/.env
            echo "PORT=${{ secrets.PROXY_PORT || 3000 }}" >> ${{ secrets.DEPLOY_PATH }}/proxy/.env

      - name: Ensure proxy cache directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            mkdir -p ${{ secrets.DEPLOY_PATH }}/proxy/cache
            touch ${{ secrets.DEPLOY_PATH }}/proxy/cache/telemetry-cache.json
            touch ${{ secrets.DEPLOY_PATH }}/proxy/cache/controllers-cache.json

      - name: Install proxy dependencies
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}/proxy
            npm ci --omit=dev

      - name: Restart proxy service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: sudo systemctl restart brew-proxy

      - name: Preload telemetry cache
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            PORT=${{ secrets.PROXY_PORT || 3000 }}
            curl -sS "http://127.0.0.1:$PORT/api/rapt/telemetry?reload=1" >/dev/null || true
